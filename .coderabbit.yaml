# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
# =============================================================================
# CodeRabbit config for mmani-demo-prs-approvals (Rabbit Outfitters microservices
# demo, approval-policy variant). Same rules as mmani-demo-prs, plus risk-limited
# automatic approval: CodeRabbit supplies one of the two required approvals when
# merge risk is low and every pre-merge check passes. A person supplies the other.
# =============================================================================
language: en-US

tone_instructions: >-
  Speak like a senior reviewer. Open each finding with "Observation:" and tie it to the exact line and the invariant at risk. Explain the why and the impact. No silent refactors, no emoji, no filler. You aid the human review, not replace it.

reviews:
  profile: chill

  # Approve only low-risk PRs. Anything rated moderate or higher, or without a
  # current merge-risk assessment, waits for two human approvals.
  auto_approvals:
    enabled: true
    max_merge_risk: low
    allow_author_approval: false

  merge_risk_instructions: >-
    High risk: removing or weakening a transaction, row lock, or CHECK constraint; SQL
    built from strings; changes to packages/contracts/src/orders.ts, which another
    repository consumes; changes to gateway authentication or the public route
    allow-list. Moderate risk: new routes, new tables, or changes to how totals are
    computed in services/orders/src/pricing.ts. Low risk: a narrow change to one
    query's filter or one validation rule in a single service, with no schema or
    contract change and a test that asserts the new behavior. Minimal risk: docs,
    comments, or test-only changes.
  high_level_summary: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  suggested_reviewers: true
  poem: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  path_filters:
    - "!**/package-lock.json"
    - "!web/dist/**"

  path_instructions:
    - path: "services/**/src/**/*.ts"
      instructions: |
        Each service owns its database. Every SQL value must be a bound parameter; flag any
        SQL built with template literals or concatenation as an injection risk. Multi-row or
        multi-table writes must be in one transaction. Outbound calls need a bounded timeout.
    - path: "services/orders/**"
      instructions: |
        Orders invariants: lines are physical catalog SKUs with quantity >= 1; discounts are
        order-level (orders.discount_cents), never order lines; 0 <= discountCents <=
        subtotalCents; netCents is never negative; only carts can change. Flag any change that
        weakens a CHECK constraint or bypasses these rules.
    - path: "packages/contracts/**"
      instructions: |
        orders.ts is a cross-repository contract consumed by
        coderabbit-demo/mmani-demo-prs-consumer. Flag semantic changes, not only renames.
    - path: "tests/**"
      instructions: |
        Tests encode intended behavior. A test that asserts a wrong result (for example a
        negative total or a negative quantity) is a defect, not evidence of correctness.

  tools:
    gitleaks:
      enabled: true
    semgrep:
      enabled: true

  pre_merge_checks:
    docstrings:
      mode: warning
      threshold: 80
    title:
      mode: warning
      requirements: "Use Conventional Commits, e.g. 'feat(orders): add discount codes'."
    description:
      mode: warning
    # Validates the PR against its linked Jira work item (project SC).
    issue_assessment:
      mode: error
    # Custom checks live as Markdown in .coderabbit/pre-merge-checks/ and report
    # as GitHub Check Runs, so branch protection can require them.

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    usage: enabled
    project_keys:
      - "SC"
  pull_requests:
    scope: auto
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "docs/**/*.md"
      - "coderabbit-demo/coderabbit-standards:guidelines/**/*.md"
      - "coderabbit-demo/coderabbit-standards:commerce/**/*.md"
  automatic_linking_mode: disabled
  linked_repositories:
    - repository: "coderabbit-demo/mmani-demo-prs-consumer"
      instructions: >-
        Downstream fulfillment and finance service. It calls GET /orders/:id on the orders
        service. src/warehouse/pickList.ts sums lines[].quantity per SKU into pick tasks and
        decrements on-hand stock; src/finance/ledger.ts posts totals.netCents as receivable,
        totals.subtotalCents as revenue, totals.discountCents as discounts, attributes
        lineTotalCents to SKUs, and caps refunds at netCents. Report changes in this PR that
        would break those call sites, including non-physical or negative-quantity lines and
        negative or double-counted totals.
